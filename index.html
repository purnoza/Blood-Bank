<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Bank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Blood Bank Management System</h1>
            <p>Select Your Role</p>
        </div>

        <div class="actors">

            <div class="actor-card" onclick="openLogin('admin')">
                <div class="icon">👨‍💼</div>
                <h2>Admin</h2>
                <p>Manage the entire blood bank system</p>
            </div>

            <div class="actor-card" onclick="openLogin('donor')">
                <div class="icon">🩸</div>
                <h2>Donor</h2>
                <p>Donate blood and respond to blood requests</p>
            </div>

            <div class="actor-card" onclick="openLogin('recipient')">
                <div class="icon">🏥</div>
                <h2>Recipient</h2>
                <p>Request blood and track request status</p>
            </div>

            <div class="actor-card" onclick="openLogin('staff')">
                <div class="icon">👩‍⚕️</div>
                <h2>Blood Bank Staff</h2>
                <p>Manage blood collection and inventory</p>
            </div>

        </div>
    </div>

<script>
function openLogin(actor){
    window.location.href = actor + '-login.html';
}
</script>

</body>
</html>
